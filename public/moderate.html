<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lex-Tabulā – Community reports</title>
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
<style>
.it{padding:14px 0;border-bottom:1px solid var(--line)}
.it small{color:var(--muted);display:block;margin:2px 0 6px}
.it p{margin:6px 0;white-space:pre-wrap;word-break:break-word}
.bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.bt .btn{padding:8px 14px;font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);margin-right:6px}
.hint{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="ib" href="settings.html" aria-label="Back" style="text-decoration:none"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Community reports</h1>
  </header>
  <main id="main" class="narrow">
    <div id="deny" class="empty hidden"><h3>Admins only</h3><p>This page is for the admin.</p></div>
    <div id="box" class="hidden">
      <p class="hint" style="margin:0 0 8px">Posts and replies reported by students. A post is hidden from everyone once 4 different students report it. Restore it if it is fine, or delete it.</p>
      <div id="msg" class="msg" role="status"></div>
      <div id="list"><p class="hint">Loading…</p></div>
    </div>
  </main>
</div>
<script src="api.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!LawLink.loggedIn()){ location.replace('login.html?next=moderate.html'); return; }
function fmt(ts){ return new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
var rows=[];
function draw(){
  $('list').innerHTML=rows.length?rows.map(function(x,i){
    return '<div class="it"><span class="tag">'+(x.kind==='post'?'Post':'Reply')+'</span><span class="tag">'+x.n+' report'+(x.n===1?'':'s')+'</span>'+(x.hidden?'<span class="tag">Hidden</span>':'')+
      '<small>By '+esc(x.author||'student')+(x.anon?' (posted anonymously)':'')+' · '+fmt(x.at)+'</small>'+
      (x.title?'<b>'+esc(x.title)+'</b>':'')+'<p>'+esc(x.body)+'</p>'+
      '<small>Reasons: '+esc(x.why.filter(Boolean).join(', ')||'none given')+'</small>'+
      '<div class="bt"><button class="btn alt" data-i="'+i+'" data-o="restore">Restore</button><button class="btn alt" data-i="'+i+'" data-o="delete">Delete</button><button class="btn alt" data-i="'+i+'" data-o="mute">Mute student 7 days</button></div></div>';
  }).join(''):'<p class="hint">No reports. All clear.</p>';
}
$('list').addEventListener('click',async function(e){
  var b=e.target.closest('button[data-i]'); if(!b) return; var x=rows[+b.dataset.i], o=b.dataset.o; b.disabled=true;
  try{
    if(o==='mute'){ await LawLink.commMute(x.uid,7); $('msg').textContent='Student muted for 7 days.'; b.disabled=false; return; }
    if(o==='delete'&&!confirm('Delete this '+x.kind+'?')){ b.disabled=false; return; }
    await LawLink.commReview(x.kind,x.id,o); rows.splice(+b.dataset.i,1); draw(); $('msg').textContent=o==='delete'?'Deleted.':'Restored.';
  }catch(err){ b.disabled=false; $('msg').textContent=err.message; }
});
LawLink.me().then(function(u){
  if(u.role!=='admin'){ $('deny').classList.remove('hidden'); return; }
  $('box').classList.remove('hidden');
  LawLink.commReports().then(function(r){ rows=r||[]; draw(); }).catch(function(e){ $('list').innerHTML='<p class="hint">'+esc(e.message)+'</p>'; });
});
})();
</script>
</body>
</html>
