<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome to Lex-Tabulā</title>
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
<style>
html,body{height:100%}
body.wl{padding:0;background:linear-gradient(180deg,#D3E3D8 0%,#E4ECE3 45%,var(--bg) 100%);overflow:hidden}
:root[data-theme="dark"] body.wl{background:linear-gradient(180deg,#11261F 0%,#0E1D18 50%,var(--bg) 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.wl{background:linear-gradient(180deg,#11261F 0%,#0E1D18 50%,var(--bg) 100%)}}
.wl .wrap{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.wl .bar{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.wl .bar button{min-width:48px;min-height:48px;border:0;background:none;color:var(--text);font:inherit;font-weight:600;font-size:16px;cursor:pointer;border-radius:12px}
.wl .bar .back{display:grid;place-items:center}
.wl .bar .back[hidden]{visibility:hidden;display:grid}
.wl .stage{flex:1;position:relative;overflow:hidden;min-height:0}
.wl .sl{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s ease;overflow-y:auto}
.wl .sl[aria-hidden="true"]{pointer-events:none}
.wl .art{width:100%;max-width:300px;flex:none;margin:6px 0 10px}
.wl .art svg{width:100%;height:auto;display:block;stroke:none;fill:none}
.wl h1{font-size:28px;line-height:1.2;text-align:center;margin:6px 0 12px}
.wl ul{list-style:none;padding:0;margin:0 0 8px;width:100%}
.wl li{display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.45;padding:7px 0}
.wl li svg{flex:none;width:22px;height:22px;margin-top:2px;color:var(--link)}
.wl .dots{display:flex;justify-content:center;gap:8px;padding:12px 0}
.wl .dots i{width:10px;height:10px;border-radius:5px;background:var(--line);transition:all .25s}
.wl .dots i.on{width:30px;background:var(--navy)}
.wl .go{width:100%;min-height:54px;border-radius:999px;font-size:17px;box-shadow:0 8px 20px rgba(28,88,72,.28)}
@media (max-height:700px){.wl .art{max-width:210px}.wl h1{font-size:24px}.wl li{font-size:16px;padding:5px 0}}
@media (prefers-reduced-motion: reduce){.wl .sl,.wl .dots i{transition:none}}
</style>
</head>
<body class="wl plain">
<div class="wrap">
  <div class="bar"><button class="back" id="back" type="button" aria-label="Previous" hidden><svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7"/></svg></button><button id="skip" type="button">Skip</button></div>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button class="btn go" id="next" type="button">Next</button>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var TICK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
var ART=[
 // 1: courses, notes with s 1 / s 2, statutes and cases
 '<svg viewBox="0 0 300 210" role="img" aria-label="Bound volumes and a note with numbered clauses">'+
  '<g stroke="none"><rect x="40" y="150" width="190" height="30" rx="4" fill="#1C5848"/><rect x="52" y="120" width="170" height="30" rx="4" fill="#27476E"/><rect x="62" y="92" width="150" height="28" rx="4" fill="#6B4A2B"/>'+
  '<rect x="50" y="150" width="2" height="30" fill="#CFA851"/><rect x="55" y="150" width="1" height="30" fill="#CFA851" opacity=".8"/><rect x="62" y="120" width="2" height="30" fill="#CFA851"/><rect x="67" y="120" width="1" height="30" fill="#CFA851" opacity=".8"/><rect x="72" y="92" width="2" height="28" fill="#CFA851"/><rect x="77" y="92" width="1" height="28" fill="#CFA851" opacity=".8"/>'+
  '<rect x="156" y="20" width="118" height="140" rx="12" fill="#fff" stroke="#1C5848" stroke-width="3"/>'+
  '<text x="172" y="58" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="16" fill="#1C5848">s 1</text><rect x="204" y="48" width="56" height="8" rx="4" fill="#D6DCD3"/>'+
  '<text x="172" y="92" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="16" fill="#1C5848">s 2</text><rect x="204" y="82" width="56" height="8" rx="4" fill="#D6DCD3"/>'+
  '<text x="172" y="126" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="16" fill="#1C5848">s 3</text><rect x="204" y="116" width="56" height="8" rx="4" fill="#D6DCD3"/></g>'+
  '<g fill="none" stroke="#B5842A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="64" cy="48" r="4"/><path d="M64 52V86M50 88H78M40 62H88M40 62L32 80M40 62L48 80M88 62L80 80M88 62L96 80M28 80Q40 92 52 80ZM76 80Q88 92 100 80Z"/></g></svg>',
 // 2: quiz card, ticked answer, small chart
 '<svg viewBox="0 0 300 210" role="img" aria-label="A quiz question with a ticked answer and a score chart"><g stroke="none"><rect x="30" y="20" width="170" height="170" rx="14" fill="#fff" stroke="#1C5848" stroke-width="3"/><rect x="46" y="38" width="110" height="9" rx="4.5" fill="#1C5848"/><rect x="46" y="54" width="80" height="9" rx="4.5" fill="#D6DCD3"/><rect x="46" y="80" width="138" height="26" rx="8" fill="#E0E8E0"/><rect x="46" y="114" width="138" height="26" rx="8" fill="#1C5848"/><path d="M58 127l6 6 11-12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="82" y="123" width="60" height="8" rx="4" fill="#fff"/><rect x="46" y="148" width="138" height="26" rx="8" fill="#E0E8E0"/><rect x="176" y="70" width="98" height="120" rx="14" fill="#1C5848"/><rect x="192" y="140" width="14" height="34" rx="3" fill="#8CC4B1"/><rect x="214" y="118" width="14" height="56" rx="3" fill="#8CC4B1"/><rect x="236" y="96" width="14" height="78" rx="3" fill="#CFA851"/><text x="225" y="92" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="14" fill="#fff">80%</text></g></svg>',
 // 3: shield with a tick
 '<svg viewBox="0 0 300 210" role="img" aria-label="A brass tablet with a tick, the seal for checked notes"><g transform="translate(95.4 42) scale(3.9)"><path d="M2 30V14a12 12 0 0 1 24 0v16z" fill="#B5842A" stroke="none"/><path d="M4.4 28V14.2a9.6 9.6 0 0 1 19.2 0V28z" fill="#CFA851" stroke="none"/><path d="M8.5 19l4 4 7-9" fill="none" stroke="#1C5848" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>'
];
var S=[
 {t:'Every law course, one place',b:['Course outlines and topic notes for every course on your list.','Statutes and cases open with one tap from inside the notes.','Your own private notes, saved to your account.']},
 {t:'Test yourself',b:['A quiz after every topic. Score 80% or more to see the answers.','IRAC practice on real-style case scenarios.','A Performance page with your scores by subject, which you can share.']},
 {t:'Checked, not guessed',b:['Notes are study aids, not legal advice. Check the original law reports and statutes before you cite.']}
];
var i=0, st=$('stage'), dots=$('dots');
S.forEach(function(s,k){
  var d=document.createElement('div'); d.className='sl'; d.id='sl'+k;
  d.innerHTML='<div class="art">'+ART[k]+'</div><h1></h1><ul>'+s.b.map(function(x){return '<li>'+TICK+'<span></span></li>'}).join('')+'</ul>';
  d.querySelector('h1').textContent=s.t;
  Array.prototype.forEach.call(d.querySelectorAll('li span'),function(el,j){ el.textContent=s.b[j]; });
  st.appendChild(d);
  var dot=document.createElement('i'); dots.appendChild(dot);
});
function paint(){
  Array.prototype.forEach.call(st.children,function(el,k){
    el.style.transform='translateX('+((k-i)*100)+'%)'; el.style.opacity=k===i?'1':'0'; el.setAttribute('aria-hidden',k===i?'false':'true');
  });
  Array.prototype.forEach.call(dots.children,function(el,k){ el.className=k===i?'on':''; });
  $('back').hidden=i===0; $('next').textContent=i===S.length-1?'Get started':'Next'; $('skip').style.visibility=i===S.length-1?'hidden':'visible';
}
function finish(){ try{ localStorage.setItem('lawlink-welcome','1'); }catch(e){} location.replace(window.LawLink&&LawLink.loggedIn&&LawLink.loggedIn()?'home.html':'login.html'); }
$('next').onclick=function(){ if(i<S.length-1){ i++; paint(); } else finish(); };
$('back').onclick=function(){ if(i>0){ i--; paint(); } };
$('skip').onclick=finish;
var x0=null;
st.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
st.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(dx<-50&&i<S.length-1){ i++; paint(); } else if(dx>50&&i>0){ i--; paint(); } },{passive:true});
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'&&i<S.length-1){ i++; paint(); } else if(e.key==='ArrowLeft'&&i>0){ i--; paint(); } });
paint();
})();
</script>
<script src="api.js"></script>
</body>
</html>
