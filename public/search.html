<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lex-Tabulā – Search</title>
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Search</h1>
  </header>
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="Search courses, topics and your notes" aria-label="Search courses, topics and your notes" autofocus>
    </label>
  </div>
  <main>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="list"></div>
  </main>

  <nav class="nav" aria-label="Main"><div>
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="courses.html"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></svg>Courses</a>
    <a href="search.html" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</a>
    <a href="notes.html"><svg viewBox="0 0 24 24"><path d="M5 20l4-1 10-10-3-3L6 16z"/></svg>Notes</a>
    <a href="community.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Community</a>
  </div></nav>
</div>

<script src="api.js"></script>
<script src="courses-data.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!getToken()){ location.replace('login.html'); return; }

var myNotes=[], MAX=40;
try{ var cc=JSON.parse(localStorage.getItem('lawlink-notes-cache')); if(cc) myNotes=cc; }catch(e){}
LawLink.listNotes().then(function(l){ myNotes=l; try{localStorage.setItem('lawlink-notes-cache',JSON.stringify(l))}catch(e){} run(); }).catch(function(){});

function norm(s){return String(s||'').toLowerCase()}
function words(q){return norm(q).split(/\s+/).filter(Boolean)}
function hit(text,ws){var t=norm(text);return ws.every(function(w){return t.indexOf(w)>-1})}

// Built once: every topic with its course and position.
var TOPICS=[];
COURSES.forEach(function(c){ c.parts.forEach(function(p,pi){ p.topics.forEach(function(t,ti){ TOPICS.push({c:c,pi:pi,ti:ti,t:t,part:p.label.replace(/ \(.*\)/,'')}); }); }); });

function mark(text,ws){
  var s=esc(text);
  ws.forEach(function(w){ var e=esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); s=s.replace(new RegExp('('+e+')(?![^<]*>)','ig'),'<mark>$1</mark>'); });
  return s;
}
function section(title,n,rows){ return rows.length?'<div class="gh">'+title+'<small>'+n+'</small></div>'+rows.join(''):''; }

function run(){
  var raw=$('q').value.trim(), ws=words(raw);
  if(!ws.length){
    $('count').textContent='';
    $('list').innerHTML='<div class="empty"><h3>Search Lex-Tabulā</h3><p>Find any course, topic, word inside the notes, law or section, or look through your own notes. Try "consideration", "tort" or just a section number like "5".</p></div>';
    return;
  }
  var cs=COURSES.filter(function(c){return hit([c.name].concat(c.aliases).join(' '),ws)});
  var ts=TOPICS.filter(function(x){return hit(x.t,ws)});
  var ns=myNotes.filter(function(n){return hit([n.title,n.course,n.topic,n.body].join(' '),ws)});
  var total=cs.length+ts.length+ns.length; lastLocalTotal=total;

  var cr=cs.slice(0,MAX).map(function(c){
    return '<a class="crow" href="course.html?id='+encodeURIComponent(c.id)+'"><strong>'+mark(c.name,ws)+'</strong><span class="m">Course'+'</span></a>';
  });
  var tr=ts.slice(0,MAX).map(function(x){
    return '<a class="crow" href="note.html?c='+encodeURIComponent(x.c.id)+'&p='+x.pi+'&i='+x.ti+'"><strong>'+mark(x.t,ws)+'</strong><span class="m">'+esc(x.c.name)+' · '+esc(x.part)+'</span></a>';
  });
  var nr=ns.slice(0,MAX).map(function(n){
    var snip=norm(n.body).indexOf(ws[0]), body=String(n.body||''), line='';
    if(snip>-1 && !hit(n.title,ws)){ line='<span class="hit">…'+mark(body.slice(Math.max(0,snip-30),snip+70).replace(/\s+/g,' '),ws)+'…</span>'; }
    return '<a class="crow" href="notes.html?q='+encodeURIComponent(raw)+'"><strong>'+mark(n.title||'Untitled note',ws)+'</strong><span class="m">Your note'+(n.course?' · '+esc(n.course):'')+'</span>'+line+'</a>';
  });
  var more=function(n){return n>MAX?'<p class="legend">Showing the first '+MAX+'. Type more of the word to narrow it down.</p>':''};
  localHtml=section('Courses',cs.length,cr)+more(cs.length)+section('Topics',ts.length,tr)+more(ts.length)+section('Your notes',ns.length,nr)+more(ns.length);
  paint(total);
  wantExtra(raw);
}
var localHtml='', extra={q:'',lib:[],laws:[],secs:[]}, xt=null;
function paint(localTotal){
  var raw=$('q').value.trim(), ex=extra.q===raw?extra:{lib:[],laws:[],secs:[]};
  var n=localTotal+ex.lib.length+ex.laws.length+ex.secs.length;
  $('count').textContent=n+(n===1?' result':' results');
  if(!n){ $('list').innerHTML='<div class="empty"><h3>Nothing found</h3><p>Check the spelling or try a shorter word.</p></div>'; return; }
  var ws=words(raw);
  var lib=ex.lib.slice(0,20).map(function(h){
    var s=h.noteId.split(':'), c=COURSES.filter(function(x){return x.id===s[1]})[0]; if(!c) return '';
    var isT=s[0]==='t', pt=isT&&c.parts[+s[2]], tp=pt&&pt.topics[+s[3]];
    if(isT&&!tp) return '';
    var href='note.html?c='+encodeURIComponent(c.id)+(isT?'&p='+s[2]+'&i='+s[3]:'');
    var snip=h.locked?'Part of the Lex-Tabulā pass':esc(h.snippet).replace(/\[\[/g,'<mark>').replace(/\]\]/g,'</mark>');
    return '<a class="crow" href="'+href+'"><strong>'+esc(isT?tp:c.name+': course note')+'</strong><span class="m">'+esc(c.name)+(h.section?' · '+esc(h.section):'')+'</span><span class="hit">'+snip+'</span></a>';
  }).filter(Boolean);
  var laws=ex.laws.slice(0,12).map(function(l){ return '<a class="crow" href="authority.html?id='+encodeURIComponent(l.id)+'"><strong>'+mark(l.name,ws)+'</strong><span class="m">Statute or rule</span></a>'; });
  var secs=ex.secs.slice(0,15).map(function(l){ return '<a class="crow" href="authority.html?id='+encodeURIComponent(l.id)+(ex.sub?'&s='+encodeURIComponent('s. '+String(l.id).split(':')[3]+ex.sub):'')+'"><strong>'+mark(l.name,ws)+(ex.sub?esc(ex.sub):'')+'</strong><span class="m">Section</span></a>'; });
  $('list').innerHTML=localHtml+section('In the notes',lib.length,lib)+section('Laws',laws.length,laws)+section('Sections',secs.length,secs);
  if(!$('list').innerHTML) $('list').innerHTML='<div class="empty"><h3>Nothing found</h3><p>Check the spelling or try a shorter word.</p></div>';
}
function wantExtra(raw){
  clearTimeout(xt);
  if(raw.length<3){ extra={q:raw,lib:[],laws:[],secs:[]}; return; }
  xt=setTimeout(async function(){
    var lib=[], laws=[], secs=[];
    try{ lib=await LawLink.searchLib(raw); }catch(e){}
    var asub='';
    try{ var f=await LawLink.findAuth(raw); laws=(f&&f.laws)||[]; secs=(f&&f.sections)||[]; asub=(f&&f.sub)||''; }catch(e){}
    if($('q').value.trim()!==raw) return;
    extra={q:raw,lib:lib||[],laws:laws,secs:secs,sub:asub};
    paint(lastLocalTotal);
  },350);
}
var lastLocalTotal=0;


var t=null;
$('q').addEventListener('input',function(){ clearTimeout(t); t=setTimeout(run,120); });
var init=new URLSearchParams(location.search).get('q'); if(init) $('q').value=init;
run();
})();
</script>
</body>
</html>
