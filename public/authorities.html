<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LawLink – Statutes</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="ib" href="home.html" aria-label="Back to home" style="text-decoration:none"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 id="hd">Statutes</h1>
  </header>
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="Search" aria-label="Search">
    </label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
  <main>
    <div class="adm hidden" id="adm"></div>
    <div class="count" id="count" aria-live="polite">Loading…</div>
    <div id="list"></div>
    <div class="kv hidden" id="req" style="margin-top:28px"><h2>Can’t find a law?</h2>
      <p class="also">Type its name and we will look into adding it.</p>
      <input class="in" id="rq" maxlength="300" placeholder="Name of the law" aria-label="Name of the law you need" style="margin-top:8px">
      <button class="btn alt" id="rsend" style="margin-top:8px">Send request</button>
      <div class="msg" id="rmsg" role="status"></div></div>
  </main>
  <nav class="nav" aria-label="Main"><div>
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="courses.html"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></svg>Courses</a>
    <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</a>
    <a href="notes.html"><svg viewBox="0 0 24 24"><path d="M5 20l4-1 10-10-3-3L6 16z"/></svg>Notes</a>
    <a href="community.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Community</a>
  </div></nav>
</div>
<script src="api.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!getToken()){ location.replace('login.html'); return; }
var kind=new URLSearchParams(location.search).get('k')==='cases'?'case':'auth', isAdmin=false, all=[], filter='all', loaded=false, found=null, foundQ='', timer=null;
var TYPES={const:'Constitution',act:'Federal Acts',state:'State laws',rule:'Court rules',sub:'Agency rules',eng:'English law',intl:'International'};
var ST={cited:'Not written yet',generated:'Ready',verified:'✓ Verified',unverifiable:'Could not be verified'};
var NOUN=kind==='case'?'case':'law';
$('hd').textContent=kind==='case'?'Cases':'Statutes';
document.title='LawLink – '+$('hd').textContent;
$('q').placeholder=kind==='case'?'Search cases':'Search, e.g. evidence act 84';

function visible(){ return all.filter(function(x){ return isAdmin||x.status==='generated'||x.status==='verified'; }); }
function okRow(x){ return isAdmin||x.status==='generated'||x.status==='verified'; }
function renderFound(){
  var secs=(found.sections||[]).filter(okRow), laws=(found.laws||[]).filter(okRow), q=$('q').value.trim();
  $('chips').classList.add('hidden');
  $('count').textContent=(secs.length+laws.length)+' result'+(secs.length+laws.length===1?'':'s');
  var h='';
  if(secs.length) h+='<div class="gh">Sections</div>'+secs.map(function(s){
    return '<a class="crow" href="authority.html?id='+encodeURIComponent(s.id)+'"><strong>'+esc(s.name)+'</strong><span class="m">'+esc(s.heading||(isAdmin?ST[s.status]:'')||'')+'</span></a>';
  }).join('');
  if(laws.length) h+='<div class="gh">'+(secs.length?'Laws':'Matching laws')+'</div>'+laws.map(function(x){
    return '<a class="crow" href="authority.html?id='+encodeURIComponent(x.id)+'"><strong>'+esc(x.name)+'</strong><span class="m">'+esc(TYPES[x.type]||'')+'</span></a>';
  }).join('');
  if(!h) h='<div class="empty"><h3>No entry yet</h3><p>There is no entry for “'+esc(q)+'” yet. Check the number, or try the name of the law.</p></div>';
  $('list').innerHTML=h;
}
function render(){
  var q=$('q').value.trim().toLowerCase();
  if(kind!=='case'&&/\d/.test(q)&&found&&foundQ===q){ renderFound(); return; }
  $('chips').classList.remove('hidden');
  var list=visible();
  if(kind!=='case'){
    var seen={}, chips=[['all','All']];
    list.forEach(function(x){ if(!seen[x.type]&&TYPES[x.type]){seen[x.type]=1; chips.push([x.type,TYPES[x.type]]);} });
    if(chips.every(function(c){return c[0]!==filter})) filter='all';
    $('chips').innerHTML=chips.map(function(c){return '<button class="chip" aria-pressed="'+(c[0]===filter)+'" data-t="'+c[0]+'">'+esc(c[1])+'</button>'}).join('');
  }else $('chips').classList.add('hidden');
  var r=list.filter(function(x){ return (filter==='all'||x.type===filter)&&(!q||x.name.toLowerCase().indexOf(q)>-1); });
  if(loaded) $('count').textContent=(kind!=='case'&&/\d/.test(q)?'Searching…':r.length+(r.length===1?' '+NOUN:' '+(kind==='case'?'cases':'laws')));
  if(!r.length){
    if(kind!=='case'&&/\d/.test(q)){ $('list').innerHTML=''; return; }
    $('list').innerHTML=loaded?'<div class="empty"><h3>'+(list.length?'Nothing matches':'Nothing here yet')+'</h3><p>'+(list.length?'Try a different word.':(kind==='case'?'Cases appear here after they have been written up.':'Pages appear here after they have been written up.'))+'</p></div>':'';
    return;
  }
  $('list').innerHTML=r.map(function(x){
    var href=(kind==='case'?'case.html?id=':'authority.html?id=')+encodeURIComponent(x.id);
    var tag=kind==='case'?'':(TYPES[x.type]||'');
    var st=isAdmin||x.status==='verified'?ST[x.status]||'':'';
    return '<a class="crow" href="'+href+'"><strong>'+esc(x.name)+'</strong><span class="m">'+esc([tag,st].filter(Boolean).join(' · '))+'</span></a>';
  }).join('');
}
// A search with a number in it ("evidence act 84") asks the database for sections. No Gemini is used.
function search(){
  render();
  var q=$('q').value.trim().toLowerCase();
  clearTimeout(timer);
  if(kind==='case'||!/\d/.test(q)) return;
  timer=setTimeout(function(){
    LawLink.findAuth(q).then(function(f){ if($('q').value.trim().toLowerCase()!==q) return; found=f||{laws:[],sections:[]}; foundQ=q; render(); })
      .catch(function(e){ $('count').textContent=(e instanceof TypeError)?'Offline. Could not search.':e.message; });
  },300);
}
$('q').oninput=search;
$('chips').onclick=function(e){var b=e.target.closest('.chip'); if(b){filter=b.dataset.t; render();}};

// Admin tools and the request box (Statutes only, not Cases)
function adminPanel(){
  var pre=new URLSearchParams(location.search).get('add')||'';
  $('adm').classList.remove('hidden');
  $('adm').innerHTML='<h3>Admin</h3><div class="also">Start with the standard list, or add one law by name. Students see a law only after you write it.</div>'+
    '<div class="btns"><button class="btn" data-a="std">Add standard laws</button></div>'+
    '<label class="f" for="nl">Add a law</label><input class="in" id="nl" maxlength="200" placeholder="e.g. Federal Road Safety Corps Act" value="'+esc(pre)+'">'+
    '<select class="in" id="nt" aria-label="Type of law" style="margin-top:8px"><option value="">Let Gemini decide the type</option><option value="act">Federal Act</option><option value="const">Constitution</option><option value="state">State law</option><option value="rule">Court rules</option><option value="sub">Agency rules</option><option value="eng">English law</option><option value="intl">International</option></select>'+
    '<label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px"><input type="checkbox" id="nsk"> Skip the Gemini check (use when Gemini is busy or its limit is used up)</label>'+
    '<div class="btns"><button class="btn alt" data-a="add">Add law</button></div>'+
    '<label class="f" for="imp" style="margin-top:16px">Import a prepared law file</label><div class="also">A .json file with the official text, prepared for you. It adds the law and all its sections in one go.</div>'+
    '<input class="in" id="imp" type="file" accept=".json,application/json" style="margin-top:8px"><div class="msg" id="amsg" role="status"></div>';
}
function casePanel(){
  $('adm').classList.remove('hidden');
  $('adm').innerHTML='<h3>Admin</h3><div class="also">Add a case by name. It starts empty. Open it and tap Write to fill it in.</div>'+
    '<label class="f" for="cnm">Case name</label><input class="in" id="cnm" maxlength="200" placeholder="e.g. Donoghue v Stevenson">'+
    '<label class="f" for="cci">Citation (optional)</label><input class="in" id="cci" maxlength="100" placeholder="e.g. [1932] AC 562">'+
    '<div class="btns"><button class="btn alt" data-a="case">Add case</button></div><div class="msg" id="amsg" role="status"></div>';
}
function say(t,err,html){ var m=$('amsg'); m.className='msg'+(err?' err':''); if(html) m.innerHTML=t; else m.textContent=t; }
$('adm').addEventListener('click',async function(e){
  var b=e.target.closest('[data-a]'); if(!b) return; var a=b.dataset.a;
  if(a==='case'){
    var cn=$('cnm').value.trim(); if(cn.length<5){ say('Type the full case name.',true); return; }
    b.disabled=true; say('Adding…');
    try{ var cr=await LawLink.addCase(cn,$('cci').value.trim()); all=await LawLink.listAuth(kind,true); $('cnm').value=''; $('cci').value=''; render();
      say((cr.existed?'Already in the list: ':'Added: ')+'<a class="auth" href="case.html?id='+encodeURIComponent(cr.id)+'">'+esc(cr.name)+'</a>. Open it to write the page.',false,true); }
    catch(x){ say(x.message,true); } b.disabled=false; return;
  }
  if(a==='std'){
    b.disabled=true; say('Adding the standard list…');
    try{ var r=await LawLink.addStandard(); all=await LawLink.listAuth(kind,true); render(); say(r.added?('Added '+r.added+' laws. Open one to write its overview.'):'The standard list is already there.'); }
    catch(x){ say(x.message,true); } b.disabled=false;
  }else if(a==='add'){
    var nm=$('nl').value.trim(); if(nm.length<4){ say('Type the name of the law first.',true); return; }
    b.disabled=true; say($('nsk').checked?'Adding…':'Checking with Gemini…');
    try{ var l=await LawLink.addLaw(nm,$('nt').value,$('nsk').checked); all=await LawLink.listAuth(kind,true); $('nl').value=''; render();
      say((l.existed?'Already in the list: ':'Added: ')+'<a class="auth" href="authority.html?id='+encodeURIComponent(l.id)+'">'+esc(l.name)+'</a>. Open it to write the overview.',false,true); }
    catch(x){ say(x.message,true); } b.disabled=false;
  }
});
document.addEventListener('change',async function(e){
  if(!e.target||e.target.id!=='imp'||!e.target.files[0]) return;
  var f=e.target.files[0], p;
  try{ p=JSON.parse(await f.text()); }catch(x){ say('That file could not be read. It must be the .json file prepared for you.',true); return; }
  var secs=Array.isArray(p.sections)?p.sections:[];
  if(!p.name||!secs.length){ say('That file has no law name or no sections.',true); return; }
  var done=0, skipped=0, flagged=0, last=null;
  try{
    for(var i=0;i<secs.length;i+=40){
      say('Importing '+Math.min(i+40,secs.length)+' of '+secs.length+' sections…');
      var r=await LawLink.importLaw({name:p.name,type:p.type,meta:i===0?p.meta:null,complete:i+40>=secs.length,sections:secs.slice(i,i+40)});
      done+=r.imported; skipped+=r.skipped; flagged+=r.flagged||0; last=r;
    }
    all=await LawLink.listAuth(kind,true); render();
    say('Done. '+done+' sections imported'+(skipped?' ('+skipped+' skipped because they were empty)':'')+'.'+(flagged?' '+flagged+' section'+(flagged===1?'':'s')+' cited in notes do not exist in this law. See the Admin inbox.':'')+' <a class="auth" href="authority.html?id='+encodeURIComponent(last.id)+'">Open '+esc(last.name)+'</a>',false,true);
  }catch(x){ say((done?'Stopped after '+done+' sections. ':'')+x.message+' Choose the file again to continue; finished sections are not duplicated.',true); }
  e.target.value='';
});
$('rsend').onclick=async function(){
  var t=$('rq').value.trim(), m=$('rmsg'); if(t.length<3){ m.className='msg err'; m.textContent='Type the name of the law first.'; return; }
  try{ await LawLink.requestLaw(t); $('rq').value=''; m.className='msg'; m.textContent='Thank you. We will look into it.'; }
  catch(x){ m.className='msg err'; m.textContent=x.message; }
};
LawLink.me().then(function(u){isAdmin=u.role==='admin'; if(kind!=='case'){ if(isAdmin) adminPanel(); else $('req').classList.remove('hidden'); } else if(isAdmin) casePanel();}).catch(function(){}).then(function(){
  return LawLink.listAuth(kind,isAdmin).then(function(l){all=l||[]; loaded=true; render();}).catch(function(e){loaded=true; $('count').textContent=(e instanceof TypeError)?'Offline. Could not load the list.':e.message; render();});
});
})();
</script>
</body>
</html>
