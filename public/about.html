<script>
(function(){
// Shows the built-in text at once, then the admin's own text if there is one (kept on the phone so it also opens offline).
var K='lawlink-about', body=document.getElementById('body');
function show(o){ body.innerHTML=window.aboutHtml(o&&o.text?o.text:window.ABOUT_DEFAULT); }
var c=null; try{ c=JSON.parse(localStorage.getItem(K)); }catch(e){}
show(c);
if(window.LawLink&&LawLink.aboutGet) LawLink.aboutGet().then(function(o){ try{ localStorage.setItem(K,JSON.stringify(o)); }catch(e){} show(o); }).catch(function(){});
})();
</script>
