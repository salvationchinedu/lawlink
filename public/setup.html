<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lex-Tabulā – Set up</title>
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
<style>
body{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:480px;margin:0 auto;padding:22px 16px 30px}
.wrap h1{font-size:26px}
.sub{color:var(--muted);margin:6px 0 4px}
.fld{display:block;margin:16px 0 4px;font-weight:600}
.req{color:var(--danger);font-weight:600}
.inp{width:100%;padding:12px;font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text)}
.inp[readonly]{background:var(--tint);color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.sec{margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.sec h2{font-size:17px}
.pick{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.pick label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick label:last-child{border-bottom:0}
.pick input{margin-top:3px;width:18px;height:18px;flex:none}
.chosen{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chosen span{background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px}
.terms{display:flex;gap:10px;align-items:flex-start;margin-top:20px;font-size:15px}
.terms input{width:22px;height:22px;flex:none;margin-top:1px}
.go{width:100%;margin-top:16px}
</style>
</head>
<body class="plain">
<div class="wrap">
  <h1>Welcome to Lex-Tabulā</h1>
  <p class="sub" id="sub">Let's set up your account. It takes a minute.</p>
  <div id="form" class="hint" style="margin-top:14px">Loading…</div>
</div>
<script src="api.js"></script>
<script src="courses-data.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!LawLink.loggedIn()){ location.replace('login.html?next=setup.html'); return; }
var next=new URLSearchParams(location.search).get('next'); if(!/^[a-z]+\.html$/.test(next||'')||next==='setup.html'||next==='login.html') next='home.html';
var UNIS=window.LAW_UNIS, P=null, picked=[];
function chosenHtml(){
  if(!picked.length) return '<p class="hint">None chosen. You can add them later from your profile.</p>';
  var by={}; COURSES.forEach(function(c){by[c.id]=c.name});
  return '<div class="chosen">'+picked.map(function(i){return '<span>'+esc(by[i]||i)+'</span>'}).join('')+'</div>';
}
function draw(){
  var opts='<option value="">Choose your university</option>'+UNIS.map(function(u){return '<option>'+esc(u)+'</option>'}).join('');
  $('form').className=''; $('form').style.marginTop='0';
  $('form').innerHTML=
   '<label class="fld" for="nm">Your name <span class="req">*</span></label><input class="inp" id="nm" maxlength="60" autocomplete="name" value="'+esc(P.name)+'"><div class="hint">This is the name other students see in Community. You can change it later, once every 14 days.</div>'+
   '<label class="fld" for="em">Email</label><input class="inp" id="em" readonly value="'+esc(P.email)+'"><div class="hint">From your Google account. Use the same Google account every time: your progress, notes and pass belong to it.</div>'+
   '<label class="fld" for="un">University <span class="req">*</span></label><select class="inp" id="un">'+opts+'</select><input class="inp hidden" id="uo" maxlength="80" placeholder="Type your university" style="margin-top:8px">'+
   '<div class="sec"><h2>Optional</h2><p class="hint" style="margin-top:2px">You can skip all of this and add it later from your profile.</p>'+
   '<label class="fld" for="pk">Courses I am taking this semester</label><div class="hint" style="margin-top:0">These show first in your course list. Every other course stays open to you.</div><div id="ch">'+chosenHtml()+'</div><button class="btn alt" id="pk" style="margin-top:10px">Choose courses</button><div id="pkw" class="hidden"><input class="inp" id="pq" type="search" placeholder="Search courses" style="margin-top:8px"><div class="pick" id="pl"></div></div>'+
   '<label class="fld" for="yr">Year of call or expected graduation</label><input class="inp" id="yr" inputmode="numeric" maxlength="4" placeholder="e.g. 2027">'+
   '<label class="fld" for="ph">Phone number</label><input class="inp" id="ph" type="tel" maxlength="20" autocomplete="tel" placeholder="e.g. 0812 345 6789"><div class="hint">Private. Only the Lex-Tabulā admin can see it.</div></div>'+
   '<label class="terms"><input type="checkbox" id="tm"><span>I agree to the <a href="privacy.html" target="_blank" rel="noopener">Terms and Privacy policy</a>. <span class="req">*</span></span></label>'+
   '<button class="btn go" id="go" disabled>Continue</button><div class="msg" id="msg" role="status" style="margin-top:10px"></div><p class="hint" style="margin-top:14px"><span class="req">*</span> needed to continue.</p>';
  $('un').onchange=function(){ $('uo').classList.toggle('hidden',$('un').value!=='Other'); check(); };
  ['nm','uo','tm'].forEach(function(i){ $(i).oninput=check; $(i).onchange=check; });
  $('pk').onclick=function(){ var w=$('pkw'); w.classList.toggle('hidden'); $('pk').textContent=w.classList.contains('hidden')?'Choose courses':'Done choosing'; if(!w.classList.contains('hidden')) list(); };
  $('pq').oninput=list;
  $('pl').onchange=function(e){ var i=e.target.value; if(e.target.checked){ if(picked.indexOf(i)<0){ if(picked.length>=30){ e.target.checked=false; say('You can choose up to 30 courses.',1); return; } picked.push(i);} } else picked=picked.filter(function(x){return x!==i}); $('ch').innerHTML=chosenHtml(); };
  $('go').onclick=submit; check();
}
function uni(){ return $('un').value==='Other'?$('uo').value.trim():$('un').value; }
function check(){ $('go').disabled=!($('nm').value.trim().length>=2&&uni()&&$('tm').checked); }
function list(){
  var q=$('pq').value.trim().toLowerCase();
  $('pl').innerHTML=COURSES.filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>-1||c.aliases.some(function(a){return a.toLowerCase().indexOf(q)>-1})}).sort(function(a,b){return a.name.localeCompare(b.name)}).map(function(c){
    return '<label><input type="checkbox" value="'+esc(c.id)+'"'+(picked.indexOf(c.id)>-1?' checked':'')+'><span>'+esc(c.name)+'</span></label>';
  }).join('')||'<p class="hint" style="padding:12px">No courses match.</p>';
}
function say(t,err){ var m=$('msg'); m.className='msg'+(err?' err':''); m.textContent=t; }
async function submit(){
  var b=$('go'); b.disabled=true; b.textContent='Saving…'; say('');
  try{
    await LawLink.setupProfile({name:$('nm').value,uni:uni(),yr:$('yr').value,phone:$('ph').value,sem:picked,terms:$('tm').checked});
    location.replace(next);
  }catch(e){ say((e instanceof TypeError)?'Could not save. Check your data and try again.':e.message,1); b.textContent='Continue'; check(); }
}
LawLink.getProfile().then(function(d){
  P=d.profile;
  if(P.done){ try{localStorage.setItem('lawlink-setup','1')}catch(e){} location.replace(next); return; }
  LawLink.me().then(function(u){ if(u.role==='admin'){ location.replace(next); return; } draw(); });
}).catch(function(e){
  if(/log in|expired/i.test(e.message)){ setToken(null); location.replace('login.html'); return; }
  $('form').textContent=(e instanceof TypeError)?'Could not load. Check your data and try again.':e.message;
});
})();
</script>
</body>
</html>
