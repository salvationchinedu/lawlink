<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LawLink – Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Courses</h1>
  </header>
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="Search courses or topics" aria-label="Search courses or topics">
    </label>
  </div>
  <div class="adm hidden" id="adm" style="margin:8px 16px"></div>
  <div class="chips" id="chips" role="group" aria-label="Filter by group"></div>
  <div style="padding:4px 16px 0"><button class="btn alt" id="sortbtn" style="min-height:40px">Sort my courses</button><span class="legend" id="sorthint" style="display:block;margin:6px 0 0"></span></div>
  <main>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="list"></div>
    <p class="legend">★ Required by the Council of Legal Education for a qualifying degree. † Listed as required by some sources.</p>
  </main>

  <nav class="nav" aria-label="Main"><div>
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="courses.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></svg>Courses</a>
    <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</a>
    <a href="notes.html"><svg viewBox="0 0 24 24"><path d="M5 20l4-1 10-10-3-3L6 16z"/></svg>Notes</a>
    <a href="community.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Community</a>
  </div></nav>
</div>

<script src="api.js"></script>
<script src="courses-data.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!getToken()){ location.replace('login.html'); return; }

var GROUPS=['core','elective','general','none'], group='All', sorting=false, isAdmin=false, hidden=[];
var NAMES={'core':'Core courses','elective':'Electives','general':'General courses','none':'Not sorted yet'};
var CHIPS=[['All','All'],['core','Core'],['elective','Electives'],['general','General'],['none','Not sorted'],['Saved','Saved']];

function norm(s){return String(s).toLowerCase()}
function topicsOf(c){var a=[];c.parts.forEach(function(p){a=a.concat(p.topics)});return a}
function match(c,q){
  if(!q) return {rank:0};
  if(norm(c.name).indexOf(q)>-1||c.aliases.some(function(a){return norm(a).indexOf(q)>-1})) return {rank:0};
  var t=topicsOf(c).filter(function(x){return norm(x).indexOf(q)>-1})[0];
  return t?{rank:1,topic:t}:null;
}
function badge(c){return c.cle===2?' · ★ CLE required':c.cle===1?' · †':''}
function tagOf(c){ var t=Prog.tag(c.id); return t==='core'||t==='elective'||t==='general'?t:'none'; }
function render(){
  var q=norm($('q').value.trim()), total=0, html='', P=Prog.get();
  document.querySelectorAll('#chips .chip').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.g===group)});
  $('sortbtn').textContent=sorting?'Done sorting':'Sort my courses';
  $('sorthint').textContent=sorting?'Tap Core, Elective or General under each course. Your choice is private to you.':'';
  GROUPS.forEach(function(g){
    if(group!=='All'&&group!=='Saved'&&group!==g) return;
    var rows=[];
    COURSES.forEach(function(c){ if(tagOf(c)!==g) return; if(group==='Saved'&&!P.saved[c.id]) return; var m=match(c,q); if(m) rows.push({c:c,m:m}); });
    rows.sort(function(a,b){return a.m.rank-b.m.rank||a.c.name.localeCompare(b.c.name)});
    if(!rows.length) return;
    total+=rows.length;
    html+='<div class="gh">'+NAMES[g]+'<small>'+rows.length+'</small></div>';
    rows.forEach(function(r){
      var c=r.c, n=topicsOf(c).length, cur=tagOf(c);
      var meta=(n?n+' topics':'Topics coming soon')+badge(c)+(P.saved[c.id]?' · Saved':'');
      html+='<div class="crowwrap"><a class="crow" href="course.html?id='+encodeURIComponent(c.id)+'"><strong>'+esc(c.name)+'</strong><span class="m">'+esc(meta)+'</span>'+(r.m.topic?'<span class="hit">Topic: '+esc(r.m.topic)+'</span>':'')+'</a>';
      if(sorting) html+='<div class="tagrow" role="group" aria-label="Sort '+esc(c.name)+'">'+[['core','Core'],['elective','Elective'],['general','General']].map(function(o){return '<button class="chip" data-cid="'+esc(c.id)+'" data-t="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>';
      html+='</div>';
    });
  });
  $('count').textContent=total+(total===1?' course':' courses');
  $('list').innerHTML=html||'<div class="empty"><h3>No courses match</h3><p>'+(group==='Saved'?'You have not saved any courses yet. Open a course and tap Save course.':group==='none'?'Every course has been sorted.':'Try a different word, like "tort" or "equity".')+'</p></div>';
}
$('chips').innerHTML=CHIPS.map(function(g){return '<button class="chip" data-g="'+g[0]+'" aria-pressed="false">'+g[1]+'</button>'}).join('');
$('chips').onclick=function(e){var b=e.target.closest('.chip');if(b){group=b.dataset.g;render()}};
$('sortbtn').onclick=function(){sorting=!sorting;render()};
$('list').onclick=function(e){
  var b=e.target.closest('button[data-cid]'); if(!b) return;
  var cur=Prog.tag(b.dataset.cid); Prog.setTag(b.dataset.cid, cur===b.dataset.t?'':b.dataset.t);
  var y=window.scrollY; render(); window.scrollTo(0,y);
};

// Admin: add a course, restore hidden ones
function adminBar(){
  var el=$('adm'); el.classList.remove('hidden');
  el.innerHTML='<h3>Admin</h3><div class="btns" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="new">Add a course</button>'+(hidden.length?'<button class="btn alt" data-a="hid">Hidden courses ('+hidden.length+')</button>':'')+'</div><div id="aform"></div><div class="msg" id="amsg" role="status"></div>';
}
function say(t,err){var m=$('amsg'); if(m){m.className='msg'+(err?' err':''); m.textContent=t;}}
$('adm').addEventListener('click',async function(e){
  var b=e.target.closest('[data-a],[data-restore]'); if(!b) return;
  if(b.dataset.restore){
    b.disabled=true;
    try{ await LawLink.courseHide(b.dataset.restore,'',false); say('Restored. Reloading…'); await window.refreshCourses(true); location.reload(); }catch(x){ b.disabled=false; say(x.message,true); }
    return;
  }
  var a=b.dataset.a;
  if(a==='new'){
    $('aform').innerHTML='<label class="f" for="cn">Course name</label><input class="in" id="cn" maxlength="120" placeholder="e.g. Maritime Law">'+
      '<label class="f" for="ca">Other names (optional, separated by commas)</label><input class="in" id="ca" maxlength="300">'+
      '<label class="f" for="ct">Topics (optional, one per line)</label><textarea class="in" id="ct" rows="6" placeholder="Introduction to maritime law&#10;Carriage of goods by sea"></textarea>'+
      '<div class="btns" style="margin-top:8px"><button class="btn" data-a="save">Save course</button></div>';
  }else if(a==='save'){
    var topics=$('ct').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
    var course={name:$('cn').value.trim(),aliases:$('ca').value.split(',').map(function(x){return x.trim()}).filter(Boolean),parts:topics.length?[{label:'Topics',topics:topics}]:[]};
    if(course.name.length<2){ say('Type the course name.',true); return; }
    b.disabled=true; say('Saving…');
    try{ var r=await LawLink.courseSave(course); say('Saved. Opening it…'); try{sessionStorage.removeItem('lawlink-creload')}catch(x){} await window.refreshCourses(true); location.href='course.html?id='+encodeURIComponent(r.id); }
    catch(x){ b.disabled=false; say(x.message,true); }
  }else if(a==='hid'){
    $('aform').innerHTML='<div class="also">Tap Restore to bring a course back.</div>'+hidden.map(function(h){return '<div class="crow" style="display:flex;align-items:center;gap:8px"><strong style="flex:1">'+esc(h.name)+'</strong><button class="btn alt" data-restore="'+esc(h.id)+'">Restore</button></div>'}).join('');
  }
});
LawLink.me().then(function(u){ if(u.role==='admin'){ isAdmin=true; return LawLink.courseList().then(function(l){ hidden=(l.items||[]).filter(function(x){return x.hidden}); adminBar(); }); } }).catch(function(){});
$('q').oninput=render;
render();
})();
</script>
</body>
</html>
