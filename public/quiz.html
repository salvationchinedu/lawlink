<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lex-Tabulā – Topic quiz</title>
<link rel="stylesheet" href="style.css">
<style>
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.qrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-of-type{border-bottom:0}
.qrow b{font-weight:600}
.qnote{background:var(--tint);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.qtimer{font:600 16px "Source Serif 4","Times New Roman",Times,"Liberation Serif",Tinos,serif;background:var(--tint);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums}
.qtimer.low{color:var(--danger);border-color:var(--danger)}
.qcount{font-weight:600;font-size:15px;color:var(--muted)}
.qtag{display:inline-block;margin-top:14px;font:600 12.5px Inter,system-ui,sans-serif;color:var(--gold2);background:var(--gold2bg);border-radius:999px;padding:3px 10px}
.qtag+.qtext{margin-top:8px}
.qtext{font:700 19px/1.4 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:16px 0 12px}
.opt{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;font:inherit;cursor:pointer;min-height:52px}
.opt>span:last-child{flex:1;min-width:0}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--tint)}
.opt[aria-pressed="true"] .l{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.opt.right{border-color:var(--sage);background:var(--tint)}
.opt.wrong{border-color:var(--danger)}
.qfoot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.qfoot>div{max-width:480px;margin:0 auto;display:flex;gap:8px}
.qfoot .btn{flex:1}
.qgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.qgrid button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:600 15px "Source Serif 4","Times New Roman",Times,"Liberation Serif",Tinos,serif;cursor:pointer}
.qgrid button.ans{background:var(--tint);border-color:var(--navy)}
.qgrid button.cur{outline:2px solid var(--gold)}
.qscore{font:700 56px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;text-align:center;margin-top:8px}
.qscore.ok{color:var(--sage)}.qscore.no{color:var(--danger)}
.qrev{margin-top:14px}
.qrev .why{font-size:14px;color:var(--muted);margin-top:6px}
</style>
<script src="ui.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="ib" id="back" href="courses.html" aria-label="Back to the note" style="text-decoration:none"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1 id="hd">Quiz</h1>
  </header>
  <main id="main" style="padding-bottom:96px"></main>
  <div class="qfoot hidden" id="foot"><div id="footin"></div></div>
</div>
<script src="api.js"></script>
<script src="courses-data.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!getToken()){ location.replace('login.html'); return; }
var q=new URLSearchParams(location.search), cid=q.get('c'), p=q.get('p'), ti=q.get('i');
var c=COURSES.filter(function(x){return x.id===cid})[0];
var part=c&&c.parts[+p], topic=part&&part.topics[+ti];
if(!topic){ $('main').innerHTML='<div class="soonbox"><h3>We could not find that quiz</h3></div>'; return; }
function ttlHtml(t){ var m=/^(.*?)\s*\((.*)\)\s*$/.exec(t); return '<h2 class="ttl" style="font-size:24px;margin:4px 0 14px">'+esc(m?m[1]:t)+(m?'<span class="tsub">'+esc(m[2].charAt(0).toUpperCase()+m[2].slice(1))+'</span>':'')+'</h2>'; }
var NID='t:'+c.id+':'+p+':'+ti, NOTE='note.html?c='+encodeURIComponent(c.id)+'&p='+p+'&i='+ti;
$('back').href=NOTE; $('hd').textContent='Quiz'; document.title='Lex-Tabulā – Quiz: '+topic;
var PV=false, TOTAL=10, L={n:10,mins:10,pass:80}, Q=[], ans={}, cur=0, endAt=0, tick=null, submitting=false, ticket='';
// The attempt in progress is kept on the phone, so a closed tab, a locked screen or a reload does not lose it.
var AK='lawlink-attempt:'+NID;
function persist(){ if(PV) return; try{ localStorage.setItem(AK,JSON.stringify({ticket:ticket,endAt:endAt,Q:Q,ans:ans,cur:cur,L:L})); }catch(e){} }
function loadAttempt(){ try{ var v=JSON.parse(localStorage.getItem(AK)); if(v&&v.Q&&v.Q.length&&v.ticket&&v.endAt&&Date.now()-v.endAt<2*3600000) return v; }catch(e){} return null; }
function clearAttempt(){ try{ localStorage.removeItem(AK); }catch(e){} }
function restore(v){ Q=v.Q; ans=v.ans||{}; cur=Math.min(v.cur||0,Q.length-1); endAt=v.endAt; ticket=v.ticket; L=v.L||L; submitting=false; }

function intro(msg,fresh){
  var sv=fresh?null:loadAttempt();
  if(sv){
    if(sv.endAt-Date.now()>0){
      $('foot').classList.add('hidden');
      $('main').innerHTML=''+ttlHtml(topic)+'<div class="qcard"><h3>You have an unfinished quiz</h3><p style="margin-top:6px">You have answered '+Object.keys(sv.ans||{}).length+' of '+sv.Q.length+' questions and there are <b>'+mmss(sv.endAt-Date.now())+'</b> left.</p><div class="btns" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="resume">Carry on</button><button class="btn alt" id="discard">Start over</button></div></div>';
      $('resume').onclick=function(){ restore(sv); clearInterval(tick); tick=setInterval(clock,500); draw(); };
      $('discard').onclick=function(){ clearAttempt(); intro(); };
      return;
    }
    // Time ran out while the student was away: send what was answered, as the timer would have.
    restore(sv); $('foot').classList.add('hidden');
    $('main').innerHTML='<div class="soonbox"><h3>Your time ended while you were away</h3><p>Submitting the answers you had given…</p></div>';
    submit(true); return;
  }
  var r=Prog.quizOf(NID), res='';
  if(r) res='<div class="qrow"><span>Best score</span><b>'+r.b+'%'+(r.p?' · Learnt ✓':'')+'</b></div><div class="qrow"><span>Attempts</span><b>'+r.n+'</b></div>';
  $('foot').classList.add('hidden');
  $('main').innerHTML=''+ttlHtml(topic)+'<div class="qcard">'+
    '<div class="qrow"><span>Number of questions</span><b>'+L.n+'</b></div>'+
    '<div class="qrow"><span>Time allowed</span><b>'+L.mins+' minutes</b></div>'+
    '<div class="qrow"><span>Pass mark</span><b>'+L.pass+'%</b></div>'+res+
    '<div class="qnote">Reach '+L.pass+'% to pass and see the correct answers with explanations. Below '+L.pass+'% you only see your score, so go back to the note and try again. You can take the quiz as many times as you like. The questions and options change order each time.</div>'+
    '<div class="btns" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="start">Take quiz</button><a class="btn alt" href="'+NOTE+'" style="text-decoration:none">Read the note</a></div>'+
    '<div class="msg err" id="qmsg" role="status">'+esc(msg||'')+'</div><button class="btn ghost" data-rep="quiz" style="margin-top:6px">Report a problem with this quiz</button></div>';
  $('start').onclick=start;
}
async function start(){
  var b=$('start'); b.disabled=true; $('qmsg').textContent=''; $('qmsg').className='msg';
  try{ var d=await LawLink.quizGet(NID); Q=d.questions; ticket=d.ticket; L.n=d.n; L.mins=d.mins||10; L.pass=d.pass||80; PV=!!d.preview; TOTAL=d.total||10; }
  catch(e){ if(/needs the (LawLink|Lex-Tabulā) pass/.test(e.message)){ $('foot').classList.add('hidden'); $('main').innerHTML=LawLink.lockHtml(''); return; } b.disabled=false; $('qmsg').className='msg err'; $('qmsg').textContent=(e instanceof TypeError)?'Could not load the quiz. Check your data and try again.':e.message; return; }
  ans={}; cur=0; submitting=false; endAt=Date.now()+L.mins*60000; persist();
  clearInterval(tick); if(!PV) tick=setInterval(clock,500); draw();
}
function mmss(ms){ var s=Math.max(0,Math.ceil(ms/1000)), m=Math.floor(s/60); s=s%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function clock(){
  var left=endAt-Date.now(), t=$('timer'); if(t){ t.textContent=mmss(left); t.classList.toggle('low',left<=60000); }
  if(left<=0&&!submitting){ clearInterval(tick); submit(true); }
}
function answered(){ return Object.keys(ans).length; }
function draw(){
  persist();
  var x=Q[cur], lt='ABCD';
  $('main').innerHTML='<div class="qbar"><span class="qcount">Question '+(cur+1)+' of '+Q.length+'</span><span class="qtimer" id="timer" role="timer" aria-label="Time left">'+(PV?'Preview':mmss(endAt-Date.now()))+'</span></div><div class="qseg" aria-hidden="true">'+Q.map(function(y,i){return '<i class="'+(i===cur?'c ':'')+(ans[y.qi]!==undefined?'a':'')+'"></i>'}).join('')+'</div>'+(PV?'<div class="qnote" style="border-left-color:var(--danger);margin:0 0 12px"><b>Preview.</b> You are seeing '+Q.length+' of '+TOTAL+' questions. Get the Lex-Tabulā pass to take the full test and submit your answers.</div>':'')+
    (x.k==='a'?'<div class="qtag">Application question</div>':x.k==='s'?'<div class="qtag">From the statute</div>':'')+'<div class="qtext">'+esc(x.q)+'</div>'+
    x.o.map(function(o,k){return '<button class="opt" data-o="'+o.oi+'" aria-pressed="'+(ans[x.qi]===o.oi)+'"><span class="l">'+lt[k]+'</span><span>'+esc(o.t)+'</span></button>'}).join('')+
    '<div class="legend" style="margin:14px 0 4px">Jump to a question</div><div class="qgrid">'+Q.map(function(y,i){return '<button data-j="'+i+'" class="'+(ans[y.qi]!==undefined?'ans ':'')+(i===cur?'cur':'')+'" aria-label="Question '+(i+1)+(ans[y.qi]!==undefined?', answered':'')+'">'+(i+1)+'</button>'}).join('')+'</div>';
  $('foot').classList.remove('hidden');
  $('footin').innerHTML='<button class="btn alt" id="prev"'+(cur?'':' disabled')+' aria-label="Previous question">‹</button><button class="btn alt" id="next"'+(cur<Q.length-1?'':' disabled')+' aria-label="Next question">›</button>'+(PV?'<a class="btn" href="subscribe.html" style="flex:3;text-decoration:none;text-align:center">Pay to submit</a>':'<button class="btn" id="sub" style="flex:3">Submit ('+answered()+'/'+Q.length+')</button>');
  $('prev').onclick=function(){cur--;draw();window.scrollTo(0,0)}; $('next').onclick=function(){cur++;draw();window.scrollTo(0,0)};
  if($('sub')) $('sub').onclick=function(){ var n=Q.length-answered(); if(n&&!confirm(n+' question'+(n===1?' is':'s are')+' not answered. Submit anyway?')) return; submit(false); };
}
$('main').addEventListener('click',function(e){
  var o=e.target.closest('.opt'), j=e.target.closest('[data-j]');
  if(o&&Q.length&&!submitting){ ans[Q[cur].qi]=+o.dataset.o; draw(); }
  else if(j){ cur=+j.dataset.j; draw(); window.scrollTo(0,0); }
});
async function submit(timeUp){
  if(submitting) return; submitting=true; clearInterval(tick);
  $('foot').classList.add('hidden');
  $('main').innerHTML='<div class="soonbox"><h3>'+(timeUp?'Time is up. ':'')+'Marking your answers…</h3></div>';
  var r=null;
  for(var k=0;k<3&&!r;k++){ try{ r=await LawLink.quizSubmit(NID,ans,ticket); }catch(e){ if(k===2){ submitting=false; Q.length&&drawFail(e); return; } await new Promise(function(ok){setTimeout(ok,800)}); } }
  clearAttempt();
  var rec=Prog.quizRec(NID,r.pct,r.pass);
  result(r,rec,timeUp||r.late);
}
function lateScreen(){
  $('main').innerHTML='<div class="qcard"><h3>Time limit passed</h3><p style="margin-top:8px">Your answers reached the server after the '+L.mins+' minutes were over, so this attempt did not count. Check that your phone clock is right and that your connection is steady, then try again.</p><div class="btns" style="margin-top:14px"><button class="btn" id="again">Try again</button></div></div>';
  $('again').onclick=function(){ intro('',true); };
}
async function report(text){
  var m=prompt('What is wrong with '+text+'? Describe it briefly.'); if(!m||!m.trim()) return;
  try{ await LawLink.libReport(NID,'Quiz problem ('+text+'): '+m.trim()); alert('Thank you. We will review it.'); }catch(e){ alert(e.message); }
}
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&tick&&!submitting) clock(); });
document.addEventListener('click',function(e){ var b=e.target.closest('[data-rep]'); if(b) report(b.dataset.rep==='quiz'?'this quiz':'question '+b.dataset.rep); });
function drawFail(e){
  $('main').innerHTML='<div class="soonbox"><h3>Your answers were not sent</h3><p>'+esc((e instanceof TypeError)?'Check your data connection.':e.message)+'</p><button class="btn" id="retry" style="margin-top:12px">Try again</button></div>';
  $('retry').onclick=function(){ submit(false); };
}
function result(r,rec,timeUp){
  var lt='ABCD', h='<div class="qcard"><div class="qscore '+(r.pass?'ok':'no')+'">'+r.pct+'%</div>'+
    '<p style="text-align:center;margin-top:4px"><strong>'+r.score+' of '+r.total+' correct</strong>'+(timeUp?' · time ran out':'')+'</p>'+
    '<p style="text-align:center;margin-top:8px">'+(r.pass?'<span class="pill tip">✓ Passed. Topic learnt</span>':'<span class="pill">Pass mark '+L.pass+'% ('+r.needed+' correct)</span>')+'</p>'+
    (r.pass?'':'<div class="qnote">You did not reach '+L.pass+'%, so the answers are not shown. Read the note again, then take the quiz once more. Your best score so far is '+rec.b+'%.</div>')+
    '<div class="btns" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+(r.pass?'':'<button class="btn" id="again">Try again</button>')+'<a class="btn '+(r.pass?'':'alt')+'" href="'+NOTE+'" style="text-decoration:none">'+(r.pass?'Back to the note':'Read the note')+'</a>'+(r.pass?'<a class="btn alt" href="course.html?id='+encodeURIComponent(c.id)+'" style="text-decoration:none">Back to the course</a>':'')+'</div></div>';
  if(r.pass){
    h+='<div class="gh">Corrections</div>'+r.review.map(function(x,i){
      return '<div class="qcard qrev"><strong>'+(i+1)+'. '+esc(x.q)+'</strong><div style="margin-top:10px">'+x.o.map(function(t,k){
        var cls=k===x.a?'right':(k===x.picked?'wrong':'');
        return '<div class="opt '+cls+'" style="cursor:default"><span class="l">'+lt[k]+'</span><span>'+esc(t)+(k===x.a?' <b>✓ correct</b>':'')+(k===x.picked&&k!==x.a?' <b>(your answer)</b>':'')+'</span></div>';
      }).join('')+'</div>'+(x.picked<0?'<div class="why">You did not answer this one.</div>':'')+(x.e?'<div class="why">'+esc(x.e)+'</div>':'')+(x.src?'<div class="why">Source: '+esc(x.src)+'</div>':'')+'<button class="btn ghost" data-rep="'+(i+1)+'" style="margin-top:8px;padding:8px 14px;font-size:13px">Report question '+(i+1)+'</button></div>';
    }).join('');
  }
  $('main').innerHTML=h; window.scrollTo(0,0);
  var a=$('again'); if(a) a.onclick=function(){ intro('',true); };
}
window.addEventListener('beforeunload',function(e){ if(Q.length&&tick&&!submitting){ e.preventDefault(); e.returnValue=''; } });
intro();
})();
</script>
</body>
</html>
