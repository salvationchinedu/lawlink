<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lex-Tabulā – Quiz statistics</title>
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="ib" id="back" href="courses.html" aria-label="Back" style="text-decoration:none"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Quiz statistics</h1>
  </header>
  <main>
    <label class="f" for="cs">Course</label><select class="in" id="cs"></select>
    <div class="msg" id="msg" role="status"></div>
    <div id="list"></div>
  </main>
</div>
<script src="api.js"></script>
<script src="courses-data.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!getToken()){ location.replace('login.html'); return; }
var cid=new URLSearchParams(location.search).get('c')||'';
$('cs').innerHTML='<option value="">Choose a course…</option>'+COURSES.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===cid?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
function name(id){ var s=id.split(':'), c=COURSES.filter(function(x){return x.id===s[1]})[0]; if(!c) return id; var pt=c.parts[+s[2]]; if(s[0]==='i') return 'IRAC test: '+(pt?pt.label.replace(/ \(.*\)/,''):'Part '+(+s[2]+1)); return (pt&&pt.topics[+s[3]])||id; }
async function load(id){
  if(!id){ $('list').innerHTML=''; return; }
  $('msg').textContent='Loading…'; $('msg').className='msg';
  try{
    var rows=await LawLink.quizStats(id); $('msg').textContent='';
    $('list').innerHTML=rows.length?rows.map(function(r){
      var rate=r.attempts?Math.round(r.passes/r.attempts*100):0;
      return '<div class="crow" style="cursor:default"><strong>'+esc(name(r.id))+'</strong><span class="m">'+r.attempts+' attempt'+(r.attempts===1?'':'s')+' · '+rate+'% passed · average score '+r.avg+'%</span>'+
        (r.hard.length?'<div style="font-size:13px;margin-top:6px"><b>Most missed:</b>'+r.hard.map(function(h){return '<div style="margin-top:3px">'+h.pct+'% got it wrong: '+esc(h.q)+'</div>'}).join('')+'</div>':'')+'</div>';
    }).join(''):'<div class="empty"><h3>No attempts yet</h3><p>Results appear here once students take the quizzes in this course. Counts are anonymous.</p></div>';
  }catch(e){ $('msg').textContent=e.message; $('msg').className='msg err'; }
}
$('cs').onchange=function(){ load($('cs').value); };
LawLink.me().then(function(u){ if(u.role!=='admin'){ $('list').innerHTML='<div class="soonbox"><h3>Admins only</h3></div>'; $('cs').disabled=true; return; } load(cid); }).catch(function(){});
})();
</script>
</body>
</html>
