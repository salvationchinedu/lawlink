<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LawLink – Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="ui.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Courses</h1>
    <button class="ib" onclick="toggleTheme()" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
  </header>
  <div class="tools">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input type="search" id="q" placeholder="Search courses or topics" aria-label="Search courses or topics">
    </label>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by group"></div>
  <main>
    <div class="count" id="count" aria-live="polite"></div>
    <div id="list"></div>
    <p class="legend">★ Required by the Council of Legal Education for a qualifying degree. † Listed as required by some sources.</p>
  </main>

  <nav class="nav" aria-label="Main"><div>
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
    <a href="courses.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/></svg>Courses</a>
    <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</a>
    <a href="notes.html"><svg viewBox="0 0 24 24"><path d="M5 20l4-1 10-10-3-3L6 16z"/></svg>Notes</a>
    <a href="community.html"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Community</a>
  </div></nav>
</div>

<script src="api.js"></script>
<script src="courses-data.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
if(!getToken()){ location.replace('login.html'); return; }

var GROUPS=['Core','Electives','Islamic law','General'], group='All';
var NAMES={'Saved':'Saved','Core':'Core courses','Electives':'Electives','Islamic law':'Islamic law','General':'General courses'};

function norm(s){return String(s).toLowerCase()}
function topicsOf(c){var a=[];c.parts.forEach(function(p){a=a.concat(p.topics)});return a}
function match(c,q){
  if(!q) return {rank:0};
  if(norm(c.name).indexOf(q)>-1||c.aliases.some(function(a){return norm(a).indexOf(q)>-1})) return {rank:0};
  var t=topicsOf(c).filter(function(x){return norm(x).indexOf(q)>-1})[0];
  return t?{rank:1,topic:t}:null;
}
function badge(c){return c.cle===2?' · ★ CLE required':c.cle===1?' · †':''}
function render(){
  var q=norm($('q').value.trim()), total=0, html='', P=Prog.get();
  document.querySelectorAll('#chips .chip').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.g===group)});
  GROUPS.forEach(function(g){
    if(group!=='All'&&group!=='Saved'&&group!==g) return;
    var rows=[];
    COURSES.forEach(function(c){ if(c.group!==g) return; if(group==='Saved'&&!P.saved[c.id]) return; var m=match(c,q); if(m) rows.push({c:c,m:m}); });
    rows.sort(function(a,b){return a.m.rank-b.m.rank||(a.c.level||999)-(b.c.level||999)||a.c.name.localeCompare(b.c.name)});
    if(!rows.length) return;
    total+=rows.length;
    html+='<div class="gh">'+NAMES[g]+'<small>'+rows.length+'</small></div>';
    rows.forEach(function(r){
      var c=r.c, n=topicsOf(c).length;
      var meta=(c.level?c.level+' Level':'Any level')+badge(c)+(P.saved[c.id]?' · Saved':'')+' · '+(n?n+' topics':'Topics coming soon');
      html+='<a class="crow" href="course.html?id='+encodeURIComponent(c.id)+'"><strong>'+esc(c.name)+'</strong><span class="m">'+esc(meta)+'</span>'+(r.m.topic?'<span class="hit">Topic: '+esc(r.m.topic)+'</span>':'')+'</a>';
    });
  });
  $('count').textContent=total+(total===1?' course':' courses');
  $('list').innerHTML=html||'<div class="empty"><h3>No courses match</h3><p>'+(group==='Saved'?'You have not saved any courses yet. Open a course and tap Save course.':'Try a different word, like "tort" or "equity".')+'</p></div>';
}
$('chips').innerHTML=['All'].concat(GROUPS).concat(['Saved']).map(function(g){return '<button class="chip" data-g="'+g+'" aria-pressed="false">'+(g==='All'?'All':NAMES[g])+'</button>'}).join('');
$('chips').onclick=function(e){var b=e.target.closest('.chip');if(b){group=b.dataset.g;render()}};
$('q').oninput=render;
render();
})();
</script>
</body>
</html>
